{
  "backend": {
    "name": "github",
    "repo": "P-E-D-R-O-Gonzalez/hub",
    "branch": "main",
    "base_url": "https://fontanaware.org",
    "auth_endpoint": "api/auth"
  },
  "local_backend": true,
  "media_folder": "main/public/uploads",
  "public_folder": "/uploads",
  "collections": [
    {
      "name": "pages",
      "label": "Pages",
      "files": [
        {
          "name": "homepage",
          "label": "Home page",
          "file": "main/src/data/homepage.json",
          "format": "json",
          "fields": [
            {
              "name": "sections",
              "label": "Sections",
              "widget": "list",
              "required": false,
              "collapsed": true,
              "summary": "{{fields.title}}",
              "hint": "Drag to reorder. Turn off Show on homepage to hide a section without deleting it. Use at most one Local Media section.",
              "fields": [
                {
                  "name": "type",
                  "label": "Section type",
                  "widget": "select",
                  "options": [
                    {
                      "label": "Link button",
                      "value": "link"
                    },
                    {
                      "label": "Embedded website",
                      "value": "embed"
                    },
                    {
                      "label": "Text only",
                      "value": "text"
                    },
                    {
                      "label": "Local Media (use once)",
                      "value": "media"
                    }
                  ],
                  "default": "link"
                },
                {
                  "name": "enabled",
                  "label": "Show on homepage",
                  "widget": "boolean",
                  "default": true,
                  "required": false
                },
                {
                  "name": "title",
                  "label": "Title",
                  "widget": "string"
                },
                {
                  "name": "description",
                  "label": "Description",
                  "widget": "text",
                  "required": false
                },
                {
                  "name": "button_label",
                  "label": "Button text",
                  "widget": "string",
                  "required": false,
                  "hint": "Required for every type except Text only."
                },
                {
                  "name": "url",
                  "label": "Website or page link",
                  "widget": "string",
                  "required": false,
                  "hint": "Required for Link button and Embedded website. Use https:// or a local path such as /localgroups/."
                },
                {
                  "name": "embed_url",
                  "label": "Embed URL",
                  "widget": "string",
                  "required": false,
                  "hint": "Required only for Embedded website. Use an HTTPS embed URL; some websites do not allow embedding."
                },
                {
                  "name": "panel_title",
                  "label": "Panel title",
                  "widget": "string",
                  "required": false,
                  "hint": "Optional accessible title for an embedded website or Local Media. Defaults to the section title."
                }
              ]
            },
            {
              "name": "footer_links",
              "label": "Footer links",
              "widget": "list",
              "required": false,
              "fields": [
                {
                  "name": "label",
                  "label": "Link text",
                  "widget": "string"
                },
                {
                  "name": "url",
                  "label": "Website or page link",
                  "widget": "string",
                  "hint": "Use https:// or a local path such as /getting-involved/."
                }
              ]
            }
          ]
        },
        {
          "name": "getting_involved",
          "label": "Get Involved",
          "file": "main/src/data/getting-involved.md",
          "fields": [
            {
              "name": "title",
              "widget": "hidden",
              "default": "Get Involved"
            },
            {
              "name": "body",
              "label": "Page content",
              "widget": "markdown",
              "required": false,
              "hint": "Add content below the Get Involved heading. Leave empty to show only the page header."
            }
          ]
        },
        {
          "name": "about_us",
          "label": "About Us",
          "file": "main/src/data/about-us.md",
          "fields": [
            {
              "name": "title",
              "widget": "hidden",
              "default": "About Us"
            },
            {
              "name": "body",
              "label": "Page content",
              "widget": "markdown",
              "required": false,
              "hint": "Tell visitors about your organization. Leave empty to show only the About Us heading."
            }
          ]
        },
        {
          "name": "local_groups",
          "label": "Local Groups",
          "file": "main/src/data/local-groups.json",
          "format": "json",
          "fields": [
            {
              "name": "categories",
              "label": "Categories",
              "label_singular": "Category",
              "widget": "list",
              "required": false,
              "collapsed": true,
              "summary": "{{fields.title}}",
              "hint": "Add a category, then add its groups. Drag categories to change their order in the website menu. Removing a category removes all groups inside it.",
              "fields": [
                {
                  "name": "title",
                  "label": "Category name",
                  "widget": "string",
                  "pattern": [
                    ".*\\S.*",
                    "Enter a category name."
                  ]
                },
                {
                  "name": "entries",
                  "label": "Groups",
                  "widget": "list",
                  "required": false,
                  "summary": "{{fields.name}}",
                  "fields": [
                    {
                      "name": "name",
                      "label": "Group name",
                      "widget": "string"
                    },
                    {
                      "name": "link",
                      "label": "Website",
                      "widget": "string",
                      "required": false,
                      "pattern": [
                        "^https?://[^\\s]+$",
                        "Use a full http:// or https:// website URL."
                      ]
                    },
                    {
                      "name": "summary",
                      "label": "Description",
                      "widget": "text"
                    }
                  ]
                }
              ]
            }
          ]
        },
        {
          "name": "translations",
          "label": "Spanish translations",
          "file": "main/src/data/translations.json",
          "format": "json",
          "fields": [
            {
              "name": "entries",
              "label": "Translations",
              "label_singular": "Translation",
              "widget": "list",
              "collapsed": true,
              "summary": "{{fields.en}}",
              "hint": "Match the English text on the page exactly. Keep placeholders such as {title}, {count}, and {account} in the Spanish version.",
              "fields": [
                {
                  "name": "en",
                  "label": "English source text",
                  "widget": "text",
                  "hint": "This identifies the text to translate; it does not change the English page.",
                  "pattern": [
                    ".*\\S.*",
                    "Enter non-empty text."
                  ]
                },
                {
                  "name": "es",
                  "label": "Spanish translation",
                  "widget": "text",
                  "pattern": [
                    ".*\\S.*",
                    "Enter non-empty text."
                  ]
                }
              ]
            }
          ]
        },
        {
          "name": "instagram",
          "label": "Local Media",
          "file": "main/src/data/instagram.json",
          "format": "json",
          "fields": [
            {
              "name": "sources",
              "label": "Instagram sources",
              "label_singular": "Instagram source",
              "widget": "list",
              "required": false,
              "collapsed": true,
              "summary": "@{{fields.username}}",
              "hint": "Add, remove, or drag accounts to reorder the Local Media feeds. Leave the list empty to show no feeds. Changes appear after publishing and deployment.",
              "fields": [
                {
                  "name": "username",
                  "label": "Instagram username",
                  "widget": "string",
                  "hint": "Enter a username such as city_of_fontana_ca, with or without @. Do not paste a profile URL. Each account should appear only once.",
                  "pattern": [
                    "^@?(?!.*\\.\\.)[A-Za-z0-9_](?:[A-Za-z0-9_.]{0,28}[A-Za-z0-9_])?$",
                    "Use 1–30 letters, numbers, underscores or periods; no spaces, URLs, consecutive periods, or periods at either end."
                  ]
                }
              ]
            }
          ]
        },
        {
          "name": "branding",
          "label": "Branding",
          "file": "main/src/data/branding.json",
          "format": "json",
          "fields": [
            {
              "name": "site_name",
              "label": "Site name",
              "widget": "string",
              "hint": "Used in Back to… navigation and the text logo when no image is configured.",
              "pattern": [
                ".*\\S.*",
                "Enter a site name."
              ]
            },
            {
              "name": "browser_title",
              "label": "Browser tab title",
              "widget": "string",
              "required": false,
              "hint": "Used on all public pages. Leave blank to use the site name."
            },
            {
              "name": "logo",
              "label": "Site logo",
              "widget": "image",
              "required": false,
              "allow_multiple": false,
              "choose_url": false,
              "hint": "Upload a PNG, JPG, WebP, GIF or SVG. The whole image fits inside the header. Clear to restore the original branding."
            },
            {
              "name": "logo_alt",
              "label": "Logo description",
              "widget": "string",
              "hint": "The site name or a short description for screen readers.",
              "pattern": [
                ".*\\S.*",
                "Enter a logo description."
              ]
            },
            {
              "name": "favicon",
              "label": "Browser favicon",
              "widget": "image",
              "required": false,
              "allow_multiple": false,
              "choose_url": false,
              "hint": "Upload a square PNG, ICO or SVG for browser tabs. A 32×32 or 48×48 PNG works well. Clear to restore the original favicon. This does not change installed-app or Apple home-screen icons."
            }
          ]
        },
        {
          "name": "weather",
          "label": "Weather",
          "file": "main/src/data/weather.json",
          "format": "json",
          "fields": [
            {
              "name": "enabled",
              "label": "Show weather and air quality",
              "widget": "boolean",
              "default": true
            },
            {
              "name": "city",
              "label": "City / location label",
              "widget": "string",
              "hint": "Displayed below the conditions. Changing this label does not change the location; update the coordinates too.",
              "pattern": [
                ".*\\S.*",
                "Enter a city or location name."
              ]
            },
            {
              "name": "latitude",
              "label": "Latitude",
              "widget": "number",
              "value_type": "float",
              "min": -90,
              "max": 90,
              "step": 0.0001,
              "hint": "Decimal degrees, from -90 to 90."
            },
            {
              "name": "longitude",
              "label": "Longitude",
              "widget": "number",
              "value_type": "float",
              "min": -180,
              "max": 180,
              "step": 0.0001,
              "hint": "Decimal degrees, from -180 to 180. Locations west of Greenwich use negative values."
            },
            {
              "name": "temperature_unit",
              "label": "Temperature units",
              "widget": "select",
              "options": [
                {
                  "label": "Fahrenheit (°F)",
                  "value": "fahrenheit"
                },
                {
                  "label": "Celsius (°C)",
                  "value": "celsius"
                }
              ]
            },
            {
              "name": "wind_speed_unit",
              "label": "Wind speed units",
              "widget": "select",
              "options": [
                {
                  "label": "Miles per hour (mph)",
                  "value": "mph"
                },
                {
                  "label": "Kilometers per hour (km/h)",
                  "value": "kmh"
                },
                {
                  "label": "Meters per second (m/s)",
                  "value": "ms"
                },
                {
                  "label": "Knots (kn)",
                  "value": "kn"
                }
              ]
            }
          ]
        }
      ]
    }
  ]
}
