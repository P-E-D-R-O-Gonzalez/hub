{
  "backend": {
    "name": "github",
    "repo": "P-E-D-R-O-Gonzalez/hub",
    "branch": "main",
    "base_url": "https://hub.pdgonzalez2004.workers.dev",
    "auth_endpoint": "api/auth"
  },
  "local_backend": true,
  "media_folder": "main/public/uploads",
  "public_folder": "/uploads",
  "collections": [
    {
      "name": "pages",
      "label": "Pages",
      "files": [
        {
          "name": "getting_involved",
          "label": "Get Involved",
          "file": "main/src/data/getting-involved.md",
          "fields": [
            {
              "name": "title",
              "widget": "hidden",
              "default": "Get Involved"
            },
            {
              "name": "body",
              "label": "Page content",
              "widget": "markdown",
              "required": false,
              "hint": "Add content below the Get Involved heading. Leave empty to show only the page header."
            }
          ]
        },
        {
          "name": "local_groups",
          "label": "Local Groups",
          "file": "main/src/data/local-groups.json",
          "format": "json",
          "fields": [
            {
              "name": "news",
              "label": "Local News Groups",
              "widget": "object",
              "fields": [
                {
                  "name": "title",
                  "label": "Section title",
                  "widget": "string"
                },
                {
                  "name": "entries",
                  "label": "Groups",
                  "widget": "list",
                  "required": false,
                  "summary": "{{fields.name}}",
                  "fields": [
                    {
                      "name": "name",
                      "label": "Group name",
                      "widget": "string"
                    },
                    {
                      "name": "link",
                      "label": "Website",
                      "widget": "string",
                      "required": false,
                      "pattern": [
                        "^https?://[^\\s]+$",
                        "Use a full http:// or https:// website URL."
                      ]
                    },
                    {
                      "name": "summary",
                      "label": "Description",
                      "widget": "text"
                    }
                  ]
                }
              ]
            },
            {
              "name": "climate-change",
              "label": "Climate Change Groups",
              "widget": "object",
              "fields": [
                {
                  "name": "title",
                  "label": "Section title",
                  "widget": "string"
                },
                {
                  "name": "entries",
                  "label": "Groups",
                  "widget": "list",
                  "required": false,
                  "summary": "{{fields.name}}",
                  "fields": [
                    {
                      "name": "name",
                      "label": "Group name",
                      "widget": "string"
                    },
                    {
                      "name": "link",
                      "label": "Website",
                      "widget": "string",
                      "required": false,
                      "pattern": [
                        "^https?://[^\\s]+$",
                        "Use a full http:// or https:// website URL."
                      ]
                    },
                    {
                      "name": "summary",
                      "label": "Description",
                      "widget": "text"
                    }
                  ]
                }
              ]
            },
            {
              "name": "religious",
              "label": "Religious Groups",
              "widget": "object",
              "fields": [
                {
                  "name": "title",
                  "label": "Section title",
                  "widget": "string"
                },
                {
                  "name": "entries",
                  "label": "Groups",
                  "widget": "list",
                  "required": false,
                  "summary": "{{fields.name}}",
                  "fields": [
                    {
                      "name": "name",
                      "label": "Group name",
                      "widget": "string"
                    },
                    {
                      "name": "link",
                      "label": "Website",
                      "widget": "string",
                      "required": false,
                      "pattern": [
                        "^https?://[^\\s]+$",
                        "Use a full http:// or https:// website URL."
                      ]
                    },
                    {
                      "name": "summary",
                      "label": "Description",
                      "widget": "text"
                    }
                  ]
                }
              ]
            },
            {
              "name": "immigration",
              "label": "Immigration Groups",
              "widget": "object",
              "fields": [
                {
                  "name": "title",
                  "label": "Section title",
                  "widget": "string"
                },
                {
                  "name": "entries",
                  "label": "Groups",
                  "widget": "list",
                  "required": false,
                  "summary": "{{fields.name}}",
                  "fields": [
                    {
                      "name": "name",
                      "label": "Group name",
                      "widget": "string"
                    },
                    {
                      "name": "link",
                      "label": "Website",
                      "widget": "string",
                      "required": false,
                      "pattern": [
                        "^https?://[^\\s]+$",
                        "Use a full http:// or https:// website URL."
                      ]
                    },
                    {
                      "name": "summary",
                      "label": "Description",
                      "widget": "text"
                    }
                  ]
                }
              ]
            }
          ]
        },
        {
          "name": "translations",
          "label": "Spanish translations",
          "file": "main/src/data/translations.json",
          "format": "json",
          "fields": [
            {
              "name": "entries",
              "label": "Translations",
              "label_singular": "Translation",
              "widget": "list",
              "collapsed": true,
              "summary": "{{fields.en}}",
              "hint": "Match the English text on the page exactly. Keep placeholders such as {title}, {count}, and {account} in the Spanish version.",
              "fields": [
                {
                  "name": "en",
                  "label": "English source text",
                  "widget": "text",
                  "hint": "This identifies the text to translate; it does not change the English page.",
                  "pattern": [
                    ".*\\S.*",
                    "Enter non-empty text."
                  ]
                },
                {
                  "name": "es",
                  "label": "Spanish translation",
                  "widget": "text",
                  "pattern": [
                    ".*\\S.*",
                    "Enter non-empty text."
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  ]
}
